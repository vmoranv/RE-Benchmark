[project]
name = "js-re-bench"
version = "0.1.0"
description = "JS/Web Reverse Engineering Comprehensive Benchmark Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "JS-RE-Bench Maintainers" }]
keywords = ["benchmark", "reverse-engineering", "javascript", "obfuscation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastapi>=0.115.0,<0.140.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.30,<2.1.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0,<3.4.0",
    "redis>=5.0.0,<6.0.0",
    "celery[redis]>=5.4.0,<5.7.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "tenacity>=9.0.0",
    "structlog>=24.0.0",
    "python-multipart>=0.0.20",
    "websockets>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "black>=24.0.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "freezegun>=1.5.0",
]
sandbox = [
    "docker>=7.1.0",
    "playwright>=1.48.0",
]

[project.scripts]
bench = "apps.cli.main:app"

[project.urls]
Homepage = "https://github.com/js-re-bench/js-re-bench"
Documentation = "https://js-re-bench.readthedocs.io"
Repository = "https://github.com/js-re-bench/js-re-bench"
Issues = "https://github.com/js-re-bench/js-re-bench/issues"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "benchmark"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "PL",      # pylint
    "RUF",     # ruff-specific
]
ignore = [
    "PLR0913",  # too many arguments
    "PLR0912",  # too many branches
    "PLR0911",  # too many return statements
    "PLR0915",  # too many statements
    "PLC0415",  # imports inside functions are intentional for lazy loading
    "PLR2004",  # magic value comparisons
    "B904",     # raise from is verbose for our internal errors
    "BLE001",   # broad exception is intentional in evaluator boundaries
    "E501",     # line length (handled by black)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101", "PLC0415"]
"benchmark/core/persistence/alembic/**/*.py" = ["I", "E"]
"apps/cli/main.py" = ["B008"]  # Typer requires Option(...) in defaults

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# Pragmatic settings for an alpha-stage benchmark — strict typing is layered
# in via per-module overrides below as code stabilizes.
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "benchmark.core.utils.*"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "benchmark.core.orchestration.state_machine"
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: marks tests as slow",
    "integration: integration tests requiring services",
    "sandbox: tests requiring docker sandbox",
    "determinism: Q2 determinism check",
]

[tool.coverage.run]
source = ["benchmark", "apps"]
omit = ["**/__init__.py", "**/alembic/**", "**/tests/**"]
