name: qualification
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  q01-headless-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify compose stack starts
        run: |
          docker compose -f infra/compose/docker-compose.yml up --build -d
          # Allow services to settle
          sleep 30
          curl --silent --fail --max-time 5 http://localhost:8000/healthz
          docker compose -f infra/compose/docker-compose.yml down -v

  q02-deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - run: pytest tests/determinism -v

  q12-semantic-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - run: pytest tests/unit/test_d1_challenge.py -v
